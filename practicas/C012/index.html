<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulario</h1>
    <form action="" method="post">
        <fieldset>
            <legend>Datos personales</legend>
            <div>
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="0" max="120" step="1">
            </div>
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="50">
        </div>
        <div>
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required  maxlength="50">
        </div>
        </fieldset>
<div>
    <label for="mensaje">Mensaje</label>
     <textarea id="mensaje" name="mensaje" rows="4" cols="50" maxlength="200"></textarea>
</div>
<div>
          <label for="turno">Turno</label>
          <select id="turno" name="turno">
            <option value=""disabled selected>Seleccione un turno</option>
            <option value="1">Mañana</option>
            <option value="2">Tarde</option>
            <option value="3">Noche</option>
          </select>
        </div>
        <h2>Modalidad</h2>
         <div>
          <label for="modalidad">Modalidad</label>
          <div>
            <label for="presencial">Presencial</label>
            <input type="radio" id="presencial" name="modalidad" value="presencial">
            
         </div>
          <div>
             <label for="online">Online</label>
            <input type="radio" id="online" name="modalidad" value="online">
        
          </div>
        <div>
            <label for="presencial">Presencial</label>
            <input type="radio" id="presencial" name="modalidad" value="presencial">
        </div>
        <fieldset>
            <legend>Intereses</legend>
        <h2>Opciones</h2>
        <div>
            <label for="opciones">Opción 1</label>
            <input type="radio" id="opciones" name="opciones" value="opciones">
        </div>
        <div>
            <label for="opciones2">Opción 2</label>
            <input type="radio" id="opciones2" name="opciones" value="opciones2">
        </div>
        <div>
            <label for="opciones3">Opción 3</label>
            <input type="radio" id="opciones3" name="opciones" value="opciones3">
        </div>
        </fieldset>
        <h2>Extras</h2>
        <div>
            <label for="extra1">Extra 1</label>
            <input type="checkbox" id="extra1" name="extra1" value="extra1">
        </div>
        <div>
            <label for="extra2">Extra 2</label>
            <input type="checkbox" id="extra2" name="extra2" value="extra2">
        </div>
        <div>
            <label for="extra3">Extra 3</label>
            <input type="checkbox" id="extra3" name="extra3" value="extra3">
        </div>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
