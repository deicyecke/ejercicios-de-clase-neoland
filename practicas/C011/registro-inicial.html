<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de práctica</title>
</head>
<body>
  <main>
    <h1>Registro de práctica</h1>
    <p>Prototipo de práctica: no envía ni guarda datos. Usá solo datos ficticios.</p>
    <form>
      <p>
        <label for="registro-usuario">Nombre de usuario</label>
        <input type="text" id="registro-usuario" name="registro-usuario">
      </p>
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre"><br><br>
      </div>
      <div>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email"><br><br>
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"><br><br>
      </div>
      <button type="button">Probar registro</button>
    </form>
  </main>
</body>
</html>
